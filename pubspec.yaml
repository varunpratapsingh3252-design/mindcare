name: mindcare
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  google_fonts: ^8.2.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  lottie: ^3.5.1
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
